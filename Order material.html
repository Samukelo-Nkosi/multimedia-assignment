<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Order Material Summary</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Header -->
    <div class="header">
        <h1>University Printing Department</h1>
    </div>

    <!-- Navigation -->
    <div class="navbar">

        <a href="home.html">Home</a>

        <a href="Order material.html">
            Order Material
        </a>

        <a href="About us.html">
            About Us
        </a>

    </div>

    <!-- Page Heading -->
    <h2 class="page-title">
        Place Your Order
    </h2>

    <!-- Order Form -->
    <form action="process.php" method="POST">

        <!-- Student Name -->
        <label for="student_name">
            Student Full Name:
        </label>

        <input
            type="text"
            id="student_name"
            name="student_name"
            placeholder="Enter your full name"
            required
        >


        <!-- Student Number -->
        <label for="student_number">
            Student Number:
        </label>

        <input
            type="text"
            id="student_number"
            name="student_number"
            placeholder="e.g. 12345678"
            required
        >


        <!-- Material Type -->
        <label for="material_type">
            Select Material Type:
        </label>

        <select
            id="material_type"
            name="material_type"
            required
        >

            <option value="Study Guide">
                Study Guide - R120
            </option>

            <option value="Tutorial Workbook">
                Tutorial Workbook - R80
            </option>

            <option value="Practical Manual">
                Practical Manual - R100
            </option>

            <option value="Revision Pack">
                Revision Pack - R60
            </option>

        </select>


        <!-- Quantity -->
        <label for="quantity">
            Quantity:
        </label>

        <input
            type="number"
            id="quantity"
            name="quantity"
            min="1"
            value="1"
            required
        >


        <!-- Printing Option -->
        <label for="printing_option">
            Printing Option:
        </label>

        <select
            id="printing_option"
            name="printing_option"
            required
        >

            <option value="Black and White">
                Black and White - R20
            </option>

            <option value="Colour">
                Colour - R50
            </option>

            <option value="Premium Binding">
                Premium Binding - R80
            </option>

        </select>


        <!-- Submit -->
        <input
            type="submit"
            value="Calculate and Order"
            name="btn"
        >

    </form>

    <!-- Footer -->
    <div class="footer">

        <p>
            University Printing Department | 2026
        </p>

        <p>
            Email: printing@university.ac.za |
            Phone: 012 345 6789
        </p>

    </div>

</body>
</html>
